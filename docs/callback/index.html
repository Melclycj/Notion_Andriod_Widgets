<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Widget - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .fallback {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .fallback a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to Notion Widget app...</p>
        <div class="fallback" id="fallback">
            <p>Could not open the app automatically.</p>
            <p><a id="manualLink" href="#">Tap here to open Notion Widget</a></p>
        </div>
    </div>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');
            var error = params.get('error');

            if (error) {
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').textContent = 'Authorization failed: ' + error;
                return;
            }

            if (!code) {
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').textContent = 'No authorization code received.';
                return;
            }

            var deepLink = 'notionwidgets://auth/callback?code=' + encodeURIComponent(code);
            if (state) {
                deepLink += '&state=' + encodeURIComponent(state);
            }

            var manualLink = document.getElementById('manualLink');
            manualLink.href = deepLink;

            window.location.href = deepLink;

            setTimeout(function() {
                document.getElementById('fallback').style.display = 'block';
            }, 2000);
        })();
    </script>
</body>
</html>
